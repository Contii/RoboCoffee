services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robocoffee}
      POSTGRES_USER: ${POSTGRES_USER:-robocoffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robocoffee}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robocoffee} -d ${POSTGRES_DB:-robocoffee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-robocoffee};Username=${POSTGRES_USER:-robocoffee};Password=${POSTGRES_PASSWORD:-robocoffee}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
